# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = migrations

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# sys.path pathplist to be prepended to the cabal of directories
# prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# timezone =

# max length of characters to use for the "slug" field
# truncate_slug_length = 40

# set to 'true' to run the environment during the
# 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow systems to find next version by version number
# instead of hash value.
# version_locations = %(here)s/migrations/versions

# version path separator; defaults to "os", which uses os.pathsep.
# version_path_separator = :

# set to 'true' to enable searching for versions recursively
# recursive_version_locations = false

# logging configuration is handled in app/core/logging.py or similar if needed.
